<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Importadora Todo Motos Xkape</title>
  <link rel="icon" href="/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme-init.js"></script>
</head>
<body>
  <!-- Inicio de sesión -->
  <main id="login-view" class="wrap" hidden>
    <form id="login-form" class="login" autocomplete="on">
      <img src="/img/logo.jpg" alt="Importadora Todo Motos Xkape">
      <h1>Panel de administración</h1>
      <div class="field">
        <label for="password">Contraseña</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="error-msg" id="login-error" role="alert"></p>
      <button class="btn btn--primary btn--block" type="submit">Entrar</button>
    </form>
  </main>

  <!-- Panel -->
  <div id="panel-view" hidden>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="/" aria-label="Ir al catálogo"><img src="/img/logo.jpg" alt="Importadora Todo Motos Xkape" width="69" height="46"></a>
        <span class="grow"></span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar tema">
          <svg class="icon i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
    </header>

    <main class="wrap admin">
      <div class="admin__bar">
        <h1>Productos <span class="muted" id="total-count"></span></h1>
        <div class="actions">
          <a class="btn btn--ghost btn--sm" href="/" target="_blank" rel="noopener">Ver catálogo</a>
          <button class="btn btn--ghost btn--sm" id="logout" type="button">Cerrar sesión</button>
        </div>
      </div>

      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">Nuevo producto</h2>
        <form id="product-form" class="form-grid" novalidate>
          <div class="field span-2">
            <label for="nombre">Nombre *</label>
            <input class="input" id="nombre" name="nombre" maxlength="120" required placeholder="Ej: Llanta trasera 90/90-17">
          </div>
          <div class="field">
            <label for="referencia">Referencia</label>
            <input class="input" id="referencia" name="referencia" maxlength="60" placeholder="Ej: FG0167">
          </div>
          <div class="field">
            <label for="medida">Medida <small>(para llantas, opcional)</small></label>
            <input class="input" id="medida" name="medida" maxlength="60" placeholder="Ej: 90/90-17">
          </div>
          <div class="field">
            <span>Disponibilidad</span>
            <label class="check"><input type="checkbox" id="agotado" name="agotado"> Marcar como agotado</label>
          </div>

          <div class="field span-2">
            <label for="imagen">Imagen <small>(JPG, PNG, WEBP o AVIF · máx. 8 MB)</small></label>
            <div class="image-row">
              <div class="preview" id="preview"></div>
              <div class="stack">
                <input class="input" id="imagen" name="imagen" type="file" accept="image/jpeg,image/png,image/webp,image/avif">
                <label class="check" id="remove-wrap" hidden><input type="checkbox" id="quitar_imagen"> Quitar la imagen actual</label>
              </div>
            </div>
          </div>

          <p class="error-msg span-2" id="form-error" role="alert"></p>
          <div class="form-actions span-2">
            <button class="btn btn--primary" id="save-btn" type="submit">Guardar producto</button>
            <button class="btn btn--ghost" id="cancel-btn" type="button" hidden>Cancelar edición</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <h2 id="list-title">Catálogo actual</h2>
        <ul class="list" id="list"></ul>
        <p class="muted" id="list-empty" hidden>Aún no hay productos. Crea el primero con el formulario de arriba.</p>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
