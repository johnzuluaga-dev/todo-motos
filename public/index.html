<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Importadora Todo Motos Xkape</title>
  <meta name="description" content="Catálogo de repuestos y llantas para moto. Arma tu pedido y envíalo por WhatsApp.">
  <link rel="icon" href="/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme-init.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/" aria-label="Importadora Todo Motos Xkape, ir al inicio">
        <img src="/img/logo.jpg" alt="Importadora Todo Motos Xkape" width="69" height="46">
      </a>

      <label class="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="sr-only">Buscar productos</span>
        <input id="search" type="search" placeholder="Buscar por nombre, referencia o medida" autocomplete="off">
      </label>

      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar tema">
        <svg class="icon i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>

      <button class="icon-btn" id="cart-btn" type="button" aria-label="Ver carrito">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="badge" id="cart-count" hidden>0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <p class="eyebrow">Importadora Todo Motos Xkape</p>
      <h1>Repuestos y llantas para tu moto</h1>
      <p>Elige tus productos, arma tu pedido y envíalo por WhatsApp.</p>
    </div>
  </section>

  <main class="wrap">
    <div class="toolbar">
      <p id="result-count" class="muted" aria-live="polite"></p>
      <label class="sort">
        Ordenar por
        <select id="sort">
          <option value="default">Más recientes</option>
          <option value="price-asc">Precio: menor a mayor</option>
          <option value="price-desc">Precio: mayor a menor</option>
          <option value="name-asc">Nombre (A → Z)</option>
        </select>
      </label>
    </div>

    <div id="grid" class="grid"></div>
    <div id="state" class="state" hidden></div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p class="footer__text">© Importadora Todo Motos Xkape</p>
      <a class="admin-link" href="/admin" rel="nofollow">Acceso admin</a>
    </div>
  </footer>

  <dialog id="product-dialog" class="dialog dialog--product" aria-label="Detalle del producto"></dialog>
  <dialog id="cart-dialog" class="dialog dialog--cart" aria-label="Carrito de compras"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
